name: Release module

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release/test version tag without leading v'
        required: true
        default: '1.1.2'
        type: string
      publish:
        description: 'Create or update a GitHub release'
        required: true
        default: false
        type: boolean
      draft:
        description: 'Create/update the GitHub release as a draft'
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

jobs:
  build_release:
    name: Build Magisk module zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release settings
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              version="${GITHUB_REF#refs/tags/v}"
              publish=true
              draft=false
          else
              version="${{ inputs.version }}"
              publish="${{ inputs.publish }}"
              draft="${{ inputs.draft }}"
          fi

          {
              echo "version=${version}"
              echo "tag=v${version}"
              echo "publish=${publish}"
              echo "draft=${draft}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper checksum
        uses: gradle/actions/wrapper-validation@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: Build release zip
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:zipRelease \
              -PprojectUrl="https://github.com/${GITHUB_REPOSITORY}" \
              -PreleaseMetadataBranch="main"

      - name: Locate release zip
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          zip_path=$(find app/build/distributions/release -maxdepth 1 -name '*.zip' -type f | sort | tail -n 1)
          if [[ -z "${zip_path}" ]]; then
              echo "No Magisk module zip produced" >&2
              exit 1
          fi
          echo "path=${zip_path}" >> "${GITHUB_OUTPUT}"
          echo "name=$(basename "${zip_path}")" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error

      - name: Create or update GitHub release
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Version ${{ steps.release.outputs.version }}
          body_path: RELEASE.md
          draft: ${{ steps.release.outputs.draft }}
          files: ${{ steps.zip.outputs.path }}
